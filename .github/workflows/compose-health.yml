name: Compose Dask health

"on":
  pull_request:
    paths:
      - .github/workflows/compose-health.yml
      - data/yaml/compose.yaml
      - data/yaml/docker-compose_sharding.yaml
      - scripts/IU_examples/python/configuration_docker.yaml
      - python/tests/test_dask_compose_healthcheck.py
  push:
    branches: [master]
    paths:
      - .github/workflows/compose-health.yml
      - data/yaml/compose.yaml
      - data/yaml/docker-compose_sharding.yaml
      - scripts/IU_examples/python/configuration_docker.yaml
      - python/tests/test_dask_compose_healthcheck.py

permissions:
  contents: read

jobs:
  compose-health:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MSPASS_RUN_COMPOSE_HEALTHCHECK_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Run live Compose health tests
        run: python -m pytest -q python/tests/test_dask_compose_healthcheck.py
