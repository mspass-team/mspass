name: Conda build

on:
  schedule:
    - cron: '21 21 * * 5'
  push:
    branches: [ master ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  conda-build-arm64:
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: provenance
        shell: bash
        run: |
          set -euxo pipefail
          requirements_file="$(mktemp)"
          trap 'rm -f "$requirements_file"' EXIT
          printf '%s\n' \
            'setuptools_scm==8.3.1 --hash=sha256:332ca0d43791b818b841213e76b1971b7711a960761c5bea5fc5cdb5196fbce3' \
            > "$requirements_file"
          python -m pip install --user --no-deps --require-hashes --requirement "$requirements_file"
          echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
          
      - name: Build and export conda package arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile_conda_build
          platforms: linux/arm64
          target: package
          outputs: type=local,dest=${{ runner.temp }}/conda-package
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            MSPASS_VERSION=${{ steps.provenance.outputs.version }}
            MSPASS_VCS_REF=${{ steps.provenance.outputs.revision }}

      - name: Install Anaconda upload client
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/anaconda-client"
          "${RUNNER_TEMP}/anaconda-client/bin/pip" install anaconda-client

      - name: Upload conda package arm64
        shell: bash
        env:
          ANACONDA_API_TOKEN: ${{ secrets.CONDA_TOKEN }}
        run: |
          scripts/upload_conda_package.sh \
            "${RUNNER_TEMP}/conda-package" \
            "${{ matrix.python-version }}" \
            "${RUNNER_TEMP}/anaconda-client/bin/anaconda"

  conda-build-amd64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && '["3.10", "3.11", "3.12", "3.13"]' || '["3.13"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: provenance
        shell: bash
        run: |
          set -euxo pipefail
          requirements_file="$(mktemp)"
          trap 'rm -f "$requirements_file"' EXIT
          printf '%s\n' \
            'setuptools_scm==8.3.1 --hash=sha256:332ca0d43791b818b841213e76b1971b7711a960761c5bea5fc5cdb5196fbce3' \
            > "$requirements_file"
          python -m pip install --user --no-deps --require-hashes --requirement "$requirements_file"
          echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
          
      - name: Build and export conda package amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile_conda_build
          platforms: linux/amd64
          target: package
          outputs: type=local,dest=${{ runner.temp }}/conda-package
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            MSPASS_VERSION=${{ steps.provenance.outputs.version }}
            MSPASS_VCS_REF=${{ steps.provenance.outputs.revision }}

      - name: Install Anaconda upload client
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/anaconda-client"
          "${RUNNER_TEMP}/anaconda-client/bin/pip" install anaconda-client

      - name: Upload conda package amd64
        shell: bash
        env:
          ANACONDA_API_TOKEN: ${{ secrets.CONDA_TOKEN }}
        run: |
          scripts/upload_conda_package.sh \
            "${RUNNER_TEMP}/conda-package" \
            "${{ matrix.python-version }}" \
            "${RUNNER_TEMP}/anaconda-client/bin/anaconda"

  conda-build-osx:
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          python-version: ${{ fromJSON((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && '["3.10", "3.11", "3.12", "3.13"]' || '["3.13"]') }}
          os: ["macos-26", "macos-15"]
      steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0

        - name: Cache Boost 1.86
          uses: actions/cache@v5
          with:
            path: ${{ runner.temp }}/mspass-boost-1.86.0
            key: mspass-boost-1.86.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/boost-download.cmake') }}

        - name: Configure Boost 1.86 cache
          shell: bash
          run: echo "MSPASS_BOOST_ROOT=${RUNNER_TEMP}/mspass-boost-1.86.0" >> "$GITHUB_ENV"
  
        - name: Setup Conda
          uses: conda-incubator/setup-miniconda@v4
          with:
            auto-update-conda: true
            channels: conda-forge,defaults
            activate-environment: ""
            auto-activate: true

        - name: Install conda build and upload clients
          shell: bash -el {0}
          run: conda install -n base -y conda-build anaconda-client

        - name: Build conda package
          id: build_package
          shell: bash -el {0}
          run: |
            export PYTHON_VERSION=${{ matrix.python-version }}
            conda config --set anaconda_upload no
            PACKAGE_PATH=$(conda build . --python ${{ matrix.python-version }} --output)
            conda build . --python ${{ matrix.python-version }}
            printf 'package_path=%s\n' "$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

        - name: Upload conda package osx
          shell: bash -el {0}
          env:
            ANACONDA_API_TOKEN: ${{ secrets.CONDA_TOKEN }}
          run: |
            scripts/upload_conda_package.sh \
              "${{ steps.build_package.outputs.package_path }}" \
              "${{ matrix.python-version }}" \
              "$(command -v anaconda)"
