version: '3.7'

services:

  mspass-dbmanager:
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    ports:
      - "127.0.0.1:27017:27017"
    depends_on:
      - mspass-shard-0
      - mspass-shard-1
    environment:
      MSPASS_ROLE: dbmanager
      MSPASS_MONGO_AUTH: "true"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?}"
      MSPASS_SHARD_LIST: rs0/mspass-shard-0:27017 rs1/mspass-shard-1:27017
      MONGODB_PORT: 27017
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --port 27017 admin --quiet --eval 'if (!db.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) { quit(1); }' --eval 'if (!db.runCommand({ping: 1}).ok) { quit(1); }'"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 5s
  
  mspass-shard-0:
    hostname: mspass-shard-0
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    environment:
      MSPASS_ROLE: shard
      MSPASS_MONGO_AUTH: "true"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?}"
      MSPASS_SHARD_ID: 0
      MONGODB_PORT: 27017
      SHARD_DB_PATH: scratch
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --port 27017 admin --quiet --eval 'if (!db.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) { quit(1); }' --eval 'if (!db.runCommand({ping: 1}).ok) { quit(1); }'"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 5s
  
  mspass-shard-1:
    hostname: mspass-shard-1
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    environment:
      MSPASS_ROLE: shard
      MSPASS_MONGO_AUTH: "true"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?}"
      MSPASS_SHARD_ID: 1
      MONGODB_PORT: 27017
      SHARD_DB_PATH: scratch
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --port 27017 admin --quiet --eval 'if (!db.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) { quit(1); }' --eval 'if (!db.runCommand({ping: 1}).ok) { quit(1); }'"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 5s

  mspass-scheduler:
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    ports:
      - "127.0.0.1:8786:8786"
    environment:
      MSPASS_ROLE: scheduler
      MSPASS_SCHEDULER: dask
      DASK_SCHEDULER_PORT: 8786
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8786
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 5s
  
  mspass-worker:
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    depends_on:
      - mspass-scheduler
    environment:
      MSPASS_ROLE: worker
      MSPASS_SCHEDULER: dask
      MSPASS_SCHEDULER_ADDRESS: mspass-scheduler
  
  mspass-frontend:
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      - mspass-dbmanager
      - mspass-scheduler
    environment:
      MSPASS_ROLE: frontend
      MSPASS_SCHEDULER: dask
      MSPASS_SCHEDULER_ADDRESS: mspass-scheduler
      MSPASS_DB_ADDRESS: mspass-dbmanager
      MSPASS_MONGO_AUTH: "true"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?}"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-}"
      JUPYTER_PORT: 8888
