
# scratch layout for s3 network yaml file

SCEDC:
    CI:
        region: us-west-2
        bucket: scedc-pds
        prefix: continuous_waveforms/
        # note CI sets loc to "_" if it blank to yield things like CIPAS__BHZ___2020015.ms
        # while a nonblank loc code is like this CIPAS__BHZ_00_2020015.ms
        # this is a way to handle that generically
        blank_loc_code_value: "_"
        object_format: "{year}/{year}_{jday:03d}/{net:2}{sta}__{chan:3}_{loc}_{year}{jday:03d}.ms"
        payload_structure: channel_day
        data_format: miniseed
        access:  open_s3
    AZ:
        region: us-west-2
        bucket: scedc-pds
        prefix: continuous_waveforms/
        # note CI sets loc to "_" if it blank to yield things like CIPAS__BHZ___2020015.ms
        # while a nonblank loc code is like this CIPAS__BHZ_00_2020015.ms
        # this is a way to handle that generically
        blank_loc_code_value: "_"
        object_format: "{year}/{year}_{jday:03d}/{net:2}{sta}__{chan:3}_{loc}_{year}{jday:03d}.ms"
        payload_structure: channel_day
        data_format: miniseed
        access:  open_s3
SCEDC_events:
    CI:
        region: us-west-2
        bucket: scedc-pds
        prefix: event_waveforms/
        object_format: "{year}/{year}_{jday:03d}/{event_id}.ms"
        payload_structure: source_gather
        data_format: miniseed
        access:  open_s3
NCEDC:
    NC:
        region: us-east-2 
        bucket: ncedc-pds
        prefix: continuous_waveforms/
        blank_loc_code_value: ""
        # this needs to be handled with a regular expression
        # the ".?." part of this definition is for a "quality indicator" 
        # which is seed thing.  An obvious legacy of local store but 
        # we will need to deal with this in the parser.   Gemini 
        # tells me valid values could be set using [DRQM] using shell wildcare
        # structure.  Need to watch that when I codde this up
        object_format: "{net:2}/{year}/{year}.{jday:03d}/{sta}.{net:2}.{chan:3}.{loc}.?.{year}.{jday:03d}"
        payload_structure: channel_day
        data_format: miniseed
        access: open_s3
    BK:
        region: us-east-2 
        bucket: ncedc-pds
        prefix: continuous_waveforms/
        blank_loc_code_value: ""
        # this needs to be handled with a regular expression
        # the ".?." part of this definition is for a "quality indicator" 
        # which is seed thing.  An obvious legacy of local store but 
        # we will need to deal with this in the parser.   Gemini 
        # tells me valid values could be set using [DRQM] using shell wildcare
        # structure.  Need to watch that when I codde this up
        object_format: "{net:2}/{year}/{year}.{jday:03d}/{sta}.{net:2}.{chan:3}.{loc}.?.{year}.{jday:03d}"
        payload_structure: channel_day
        data_format: miniseed
        access: open_s3
