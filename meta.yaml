# Container builds do not include .git; use the version and revision resolved by
# the workflow.  Keep the existing git-derived behavior for non-container builds.
{% if environ.get('MSPASS_VERSION') %}
{%   set version = environ.get('MSPASS_VERSION') %}
{% elif GIT_DESCRIBE_TAG is defined %}
{%   set version = GIT_DESCRIBE_TAG[1:] %}
{% else %}
{%   set version = "0.0.0" %}
{% endif %}
{% if environ.get('MSPASS_VCS_REF') %}
{%   set vcs_ref = environ.get('MSPASS_VCS_REF') %}
{% elif GIT_FULL_HASH is defined %}
{%   set vcs_ref = GIT_FULL_HASH %}
{% else %}
{%   set vcs_ref = "unknown" %}
{% endif %}
{% if GIT_DESCRIBE_NUMBER is defined %}
{%   set describe_number = GIT_DESCRIBE_NUMBER %}
{% else %}
{%   set describe_number = environ.get('GIT_DESCRIBE_NUMBER', 0) %}
{% endif %}

package:
  name: mspasspy
  version: {{ version }}

source:
  path: .

build:
  script: scripts/conda_build.sh
  script_env:
    - MSPASS_BOOST_ROOT
{% if environ.get('SETUPTOOLS_SCM_PRETEND_VERSION_FOR_MSPASSPY') %}
    - SETUPTOOLS_SCM_PRETEND_VERSION_FOR_MSPASSPY
{% endif %}
  include_recipe: False
  number: {{ describe_number }}
  string: py{{ CONDA_PY }}_{{ describe_number|int }}_g{{ vcs_ref[:8] }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('gfortran') }}
    - gsl


  host:
    - python {{ PYTHON_VERSION }}
    - pip
    - setuptools>=64,<70
    - setuptools_scm
    - wheel
    - numpy>=2.2.6
    - cmake>=3.18
    - gsl
    # Boost.Serialization 1.86 is built statically by cxx/cmake.  Conda-forge
    # does not provide 1.86, so a boost-cpp dependency would mix in 1.85.
    - liblapack
    - yaml-cpp

  run:
    - python {{ PYTHON_VERSION }}
    - pyyaml
    - pymongo>=4.14.1
    - numpy>=2.2.6
    - obspy
    - dill
    - click
    - dask>=2025.9.1
    - distributed
    - cloudpickle
    - schema
    - decorator
    - aioboto3>=15.5.0,<15.6.0
    - aiobotocore>=2.25.1,<2.26.0
    - boto3>=1.40.46,<1.40.62
    - botocore>=1.40.46,<1.40.62
    - requests
    - xarray
    - zarr
    - pandas>=2.3.3
    - numba
    - multitaper
    - ipympl
    - python-graphviz
    - graphviz
    - libzlib
    - cartopy
    - gsl
    - liblapack
    - yaml-cpp


about:
  home: https://github.com/mspass-team/mspass
  license: BSD 3-Clause
  license_file: LICENSE
  license_family: BSD
  license_url: https://github.com/mspass-team/mspass/blob/master/LICENSE
  summary: Massive Parallel Analysis System for Seismologists
  description: |
    The Massive Parallel Analysis System for Seismologists is an open source framework 
    for seismic data processing and management. It has three core components. 
    A scalable parallel processing framework based on a dataflow computation model. 
    A NoSQL database system centered on document store. 
    A container-based virtualization environment.
  dev_url: https://github.com/mspass-team/mspass
  doc_url: https://www.mspass.org
  doc_source_url: https://github.com/mspass-team/mspass/blob/master/docs/source/index.rst
