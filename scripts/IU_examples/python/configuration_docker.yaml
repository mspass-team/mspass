services:

  mspass-db:
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MSPASS_ROLE: db
      MSPASS_MONGO_AUTH: "true"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?}"
      MONGODB_PORT: 27017
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --port 27017 admin --quiet --eval 'if (!db.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) { quit(1); }' --eval 'if (!db.runCommand({ping: 1}).ok) { quit(1); }'"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 5s
  
  mspass-scheduler:
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    ports:
      - "127.0.0.1:8786:8786"
      - "127.0.0.1:8787:8787"
    environment:
      MSPASS_ROLE: scheduler
      MSPASS_SCHEDULER: dask
      DASK_SCHEDULER_PORT: 8786
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8786
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 5s
  
  mspass-worker:
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    depends_on:
      - mspass-scheduler
    environment:
      MSPASS_ROLE: worker
      MSPASS_SCHEDULER: dask
      MSPASS_SCHEDULER_ADDRESS: mspass-scheduler
      MSPASS_WORKER_ARG: --nworkers=4 --nthreads=1
  
  mspass-frontend:
    image: mspass/mspass
    volumes:
      - "${PWD}/:/home"
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      - mspass-db
      - mspass-scheduler
    environment:
      MSPASS_ROLE: frontend
      MSPASS_SCHEDULER: dask
      MSPASS_SCHEDULER_ADDRESS: mspass-scheduler
      MSPASS_DB_ADDRESS: mspass-db
      MSPASS_MONGO_AUTH: "true"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?}"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-}"
      JUPYTER_PORT: 8888
